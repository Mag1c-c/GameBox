<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>设置</title>
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; }
  :root, [data-theme="dark"] {
    --bg: #1a1a2e;
    --bg-secondary: #16213e;
    --bg-tertiary: #1f2b4d;
    --bg-elevated: #2a3a66;
    --border: #2a3a66;
    --text: #ffffff;
    --text-secondary: #7a8ab8;
    --text-tertiary: #cfd8f0;
    --accent: #e94560;
  }
  [data-theme="light"] {
    --bg: #f2f2f7;
    --bg-secondary: #ffffff;
    --bg-tertiary: #ffffff;
    --bg-elevated: #e8e8f0;
    --border: #d8d8e2;
    --text: #1a1a2e;
    --text-secondary: #6a6a8a;
    --text-tertiary: #4a4a6a;
    --accent: #e94560;
  }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto;
  }
  .back-btn {
    background: var(--bg-tertiary);
    border: 1.5px solid var(--border);
    color: var(--text-tertiary);
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
    text-decoration: none;
    display: inline-block;
  }
  .back-btn:hover { border-color: var(--accent); }
  .back-btn:active { transform: scale(0.96); }
  .page-title {
    font-size: 20px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .settings-group {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .group-label {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    margin: 20px 0 8px 4px;
    font-weight: bold;
  }
  .settings-list {
    background: var(--bg-tertiary);
    border-radius: 16px;
    border: 1.5px solid var(--border);
    overflow: hidden;
  }
  .settings-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    color: var(--text);
  }
  .settings-item:last-child { border-bottom: none; }
  .settings-item.col {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }

  .theme-group {
    display: flex;
    gap: 4px;
    background: var(--bg-secondary);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .theme-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    border-radius: 8px;
    padding: 10px 8px;
    font-size: 13px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    touch-action: manipulation;
  }
  .theme-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .theme-btn:active { transform: scale(0.96); }

  .danger-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s;
    touch-action: manipulation;
  }
  .danger-btn:active { transform: scale(0.94); }

  .version-text { color: var(--text-secondary); font-size: 13px; }
</style>
</head>
<body>
  <div class="header">
    <a class="back-btn" href="index.html">← 返回</a>
    <div class="page-title">设置</div>
  </div>

  <div class="settings-group">
    <div class="group-label">外观</div>
    <div class="settings-list">
      <div class="settings-item col">
        <div>主题</div>
        <div class="theme-group">
          <button class="theme-btn" data-theme="system" onclick="setTheme('system')">🌓 跟随系统</button>
          <button class="theme-btn" data-theme="light" onclick="setTheme('light')">☀️ 白天</button>
          <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 夜晚</button>
        </div>
      </div>
    </div>

    <div class="group-label">数据</div>
    <div class="settings-list">
      <div class="settings-item">
        <span>清除所有游戏记录</span>
        <button class="danger-btn" onclick="clearData()">清除</button>
      </div>
    </div>

    <div class="group-label">关于</div>
    <div class="settings-list">
      <div class="settings-item">
        <span>版本</span>
        <span class="version-text">1.0</span>
      </div>
    </div>
  </div>

<script>
  function refreshUI() {
    const theme = localStorage.getItem('theme') || 'system';
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.theme === theme);
    });
  }
  
  function setTheme(theme) {
    localStorage.setItem('theme', theme);
    window.__reapplyTheme();
    refreshUI();
  }
  
  function clearData() {
    if (confirm('确定要清除所有游戏记录吗？（最高分等）')) {
      localStorage.removeItem('blockGameHighScore');
      alert('已清除');
    }
  }
  
  refreshUI();
</script>
</body>
</html>
