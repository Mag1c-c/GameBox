<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>设置</title>
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; }
  :root, [data-theme="dark"] {
    --bg: #1a1a2e; --bg-secondary: #16213e; --bg-tertiary: #1f2b4d; --bg-elevated: #2a3a66;
    --border: #2a3a66; --text: #ffffff; --text-secondary: #7a8ab8; --text-tertiary: #cfd8f0;
    --accent: #e94560; --nav-bg: rgba(15, 21, 42, 0.96);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.15);
  }
  [data-theme="light"] {
    --bg: #f2f2f7; --bg-secondary: #ffffff; --bg-tertiary: #ffffff; --bg-elevated: #e8e8f0;
    --border: #d8d8e2; --text: #1a1a2e; --text-secondary: #6a6a8a; --text-tertiary: #4a4a6a;
    --accent: #e94560; --nav-bg: rgba(250, 250, 252, 0.96);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
  }
  html, body {
    margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    user-select: none; -webkit-user-select: none; overflow-x: hidden; padding-bottom: 90px;
    transition: background 0.3s, color 0.3s;
  }
  .header { display: flex; align-items: center; padding: 32px 20px 24px; max-width: 480px; margin: 0 auto; }
  .page-title { font-size: 24px; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
  
  .settings-group { max-width: 480px; margin: 0 auto; padding: 0 20px; }
  .group-label { font-size: 13px; color: var(--text-secondary); letter-spacing: 1px; margin: 20px 0 8px 4px; font-weight: bold; }
  .settings-list {
    background: var(--bg-tertiary); border-radius: var(--radius-lg); /* 16px */
    border: 1.5px solid var(--border); overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .settings-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    font-size: 15px; color: var(--text);
  }
  .settings-item:last-child { border-bottom: none; }
  .settings-item.col { flex-direction: column; align-items: stretch; gap: 12px; }

  .theme-group { display: flex; gap: 6px; background: var(--bg-secondary); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .theme-btn {
    flex: 1; background: transparent; border: none; color: var(--text-secondary);
    border-radius: var(--radius-sm); padding: 10px 6px; font-size: 13px; font-weight: bold;
    font-family: inherit; cursor: pointer; transition: background 0.2s, color 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .theme-btn.active { background: var(--accent); color: #fff; }
  .theme-btn:active { transform: scale(0.96); }

  .danger-btn {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 8px 16px; font-size: 13px; font-weight: bold; font-family: inherit; cursor: pointer;
  }
  .danger-btn:active { transform: scale(0.94); }
  .version-text { color: var(--text-secondary); font-size: 13px; }

  /* 底部导航 */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1.5px solid var(--border); display: flex; justify-content: space-around;
    padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  }
  .nav-btn {
    background: none; border: none; color: var(--text-secondary); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 28px; cursor: pointer; border-radius: var(--radius-md);
    text-decoration: none; touch-action: manipulation;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn .nav-icon { font-size: 22px; }
  .nav-btn .nav-label { font-size: 11px; font-weight: bold; }
</style>
</head>
<body>
  <div class="header"><div class="page-title">设置</div></div>

  <div class="settings-group">
    <div class="group-label">外观</div>
    <div class="settings-list">
      <div class="settings-item col">
        <div>主题</div>
        <div class="theme-group">
          <button class="theme-btn" data-theme="system" onclick="setTheme('system')">🌓 跟随系统</button>
          <button class="theme-btn" data-theme="light" onclick="setTheme('light')">☀️ 白天</button>
          <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 夜晚</button>
        </div>
      </div>
    </div>

    <div class="group-label">数据</div>
    <div class="settings-list">
      <div class="settings-item">
        <span>清除所有游戏记录</span>
        <button class="danger-btn" onclick="clearData()">清除</button>
      </div>
    </div>

    <div class="group-label">关于</div>
    <div class="settings-list">
      <div class="settings-item">
        <span>版本</span><span class="version-text">1.0</span>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-btn" href="index.html"><span class="nav-icon">🏠</span><span class="nav-label">主页</span></a>
    <a class="nav-btn active" href="settings.html"><span class="nav-icon">☰</span><span class="nav-label">设置</span></a>
  </div>

<script>
  function refreshUI() {
    const theme = localStorage.getItem('theme') || 'system';
    document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.theme === theme));
  }
  function setTheme(theme) {
    localStorage.setItem('theme', theme); window.__reapplyTheme(); refreshUI();
  }
  function clearData() {
    if (confirm('确定要清除所有游戏记录吗？（最高分等）')) {
      localStorage.removeItem('blockGameHighScore'); alert('已清除');
    }
  }
  refreshUI();
</script>
</body>
</html>
